name: Mantener despierto el backend (Render)

# INTENTO 1, DESACTIVADO — el "schedule: cron" de GitHub Actions NO es
# confiable a cada 10 min: es "mejor esfuerzo", GitHub lo puede
# retrasar o directamente saltear corridas bajo carga, y en la
# práctica acá terminó disparando ~2 veces en 18 hs en vez de las ~100
# que tendría que haber disparado (ver investigación del 17/11,
# confirmado también por la propia documentación/comunidad de GitHub:
# https://upptime.js.org/blog/2021/01/22/github-actions-schedule-not-working/
# — "a schedule for every five minutes sometimes ran only about once
# an hour"). O sea que esto nunca llegó a mantener nada despierto de
# verdad; los mails de "failed" eran las pocas veces que sí disparó,
# justo agarrando al backend recién arrancando en frío (ver el curl
# --max-time de abajo, aumentado por eso).
#
# Por ahora vuelve a quedar como estaba antes de este workflow: Render
# se duerme a los 15 min sin tráfico como siempre, con el único paliativo
# siendo el ping de App.tsx al abrir la app (usarDespertarBackend). Si
# se decide reactivar el keep-warm de verdad, hace falta un servicio
# externo pensado para esto (cron-job.org, UptimeRobot, etc.) en vez
# del cron de GitHub Actions — ese sí cumple el horario que se le pida.
#
# El job y el curl quedan funcionando para poder pingear a mano desde
# la pestaña Actions (botón "Run workflow") cuando haga falta despertarlo
# ya mismo, por ejemplo antes de un evento.
on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        # 150s, no 60: un arranque en frío de verdad (container +
        # Python + el pre-calentado de librosa/numba en main.py) a
        # veces tarda más de 60s, y no tiene sentido marcarlo como
        # "failed" si el backend igual terminó despertando bien.
        run: curl -fsS --max-time 150 https://clubpack-api.onrender.com/health
